
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Abu Sayem Nur — Software Development, AI and Research Portfolio">
  <title>Abu Sayem Nur | Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="nav-container">
    <a href="#home" class="logo">ASN<span>.</span></a>

    <button class="menu-toggle" id="menuToggle"
      aria-label="Toggle navigation">☰</button>

    <nav id="navigation">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#skills">Skills</a>
      <a href="#research">Research</a>
      <a href="#certifications">Certificates</a>
      <a href="#blog">Blog</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<main id="content">
  <div class="loading">Loading portfolio...</div>
</main>

<footer class="footer">
  <p>© <span id="year"></span> Abu Sayem Nur. All rights reserved.</p>
  <p>Computer Science · AI · Research</p>
</footer>

<script>
const sections = [
  "home", "about", "projects", "skills",
  "research", "certifications", "blog", "contact"
];

const content = document.getElementById("content");
const navigation = document.getElementById("navigation");
const menuToggle = document.getElementById("menuToggle");

async function loadSection(name) {
  if (!sections.includes(name)) name = "home";

  try {
    const response = await fetch(`sections/${name}.html`);

    if (!response.ok) {
      throw new Error("Section could not be loaded.");
    }

    content.innerHTML = await response.text();

    document.querySelectorAll("#navigation a").forEach(link => {
      link.classList.toggle(
        "active",
        link.getAttribute("href") === `#${name}`
      );
    });

    document.title =
      name.charAt(0).toUpperCase() + name.slice(1) +
      " | Abu Sayem Nur";

    navigation.classList.remove("open");
    menuToggle.setAttribute("aria-expanded", "false");

    initializePage();
    window.scrollTo({ top: 0, behavior: "smooth" });

  } catch (error) {
    content.innerHTML = `
      <section class="section container">
        <h1>Unable to load this page</h1>
        <p>Please run the website using VS Code Live Server.</p>
      </section>`;
  }
}

function initializePage() {
  // Open project and certificate images in a preview modal.
  document.querySelectorAll("[data-preview]").forEach(image => {
    image.addEventListener("click", () => {
      const modal = document.getElementById("imageModal");
      if (!modal) return;

      modal.querySelector("img").src = image.src;
      modal.classList.add("show");
    });
  });

  const modal = document.getElementById("imageModal");

  if (modal) {
    modal.querySelector(".modal-close").onclick = () => {
      modal.classList.remove("show");
    };

    modal.onclick = event => {
      if (event.target === modal) {
        modal.classList.remove("show");
      }
    };
  }

  // Contact form opens the visitor's email application.
  const form = document.getElementById("contactForm");

  if (form) {
    form.addEventListener("submit", event => {
      event.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const message = document.getElementById("message").value;

      const subject = encodeURIComponent(
        "Portfolio message from " + name
      );

      const body = encodeURIComponent(
        "Name: " + name +
        "\nEmail: " + email +
        "\n\n" + message
      );

      // Replace with your actual email address.
      window.location.href =
        `mailto:your.email@example.com?subject=${subject}&body=${body}`;
    });
  }
}

navigation.addEventListener("click", event => {
  const link = event.target.closest("a[href^='#']");
  if (!link) return;

  event.preventDefault();
  const hash = link.getAttribute("href");

  if (location.hash === hash) {
    loadSection(hash.slice(1));
  } else {
    location.hash = hash;
  }
});

menuToggle.addEventListener("click", () => {
  const isOpen = navigation.classList.toggle("open");
  menuToggle.setAttribute("aria-expanded", String(isOpen));
});

window.addEventListener("hashchange", () => {
  loadSection(location.hash.slice(1) || "home");
});

document.getElementById("year").textContent =
  new Date().getFullYear();

loadSection(location.hash.slice(1) || "home");
</script>

</body>
</html>
