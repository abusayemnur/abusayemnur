
<section class="section">
  <div class="container">
    <p class="kicker">Get in Touch</p>
    <h1 class="section-title">Let's Connect</h1>
    <p class="intro">
      Have a project idea or want to collaborate?
      Feel free to get in touch.
    </p>

    <div class="contact-grid">
      <div class="card">
        <h3>Contact Information</h3>
        <p>Connect with me through these platforms.</p>

        <div class="contact-method">
          <h3>Email</h3>
          <a href="mailto:your.email@example.com" class="text-link">
            abusayemnur121@gmail.com
          </a>
        </div>

        <div class="contact-method">
          <h3>GitHub</h3>
          <a href="https://github.com/abusayemnur"
             target="_blank" rel="noopener" class="text-link">
            github.com/abusayemnur ↗
          </a>
        </div>

        <div class="contact-method">
          <h3>LinkedIn</h3>
          <a href="https://www.linkedin.com/in/abusayemnur/"
             target="_blank" rel="noopener" class="text-link">
            LinkedIn Profile ↗
          </a>
        </div>

        <div class="contact-method">
          <h3>X</h3>
          <a href="https://x.com/abusayemnur"
             target="_blank" rel="noopener" class="text-link">
            @abusayemnur ↗
          </a>
        </div>
      </div>

      <div class="card">
        <h3>Send a Message</h3>

        <form class="contact-form" id="contactForm">
          <label for="name">Your Name</label>
          <input id="name" name="name" required
                 placeholder="Enter your name">

          <label for="email">Your Email</label>
          <input id="email" name="email" type="email"
                 required placeholder="you@example.com">

          <label for="message">Message</label>
          <textarea id="message" name="message"
                    required placeholder="Write your message..."></textarea>

          <div class="buttons">
            <button type="submit" class="btn btn-primary">
              Prepare Email ↗
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
